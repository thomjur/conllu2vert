[project]
name = "conllu2vert"
version = "0.1.0"
description = "Convert CoNLL-U files into a Sketch Engine vertical corpus"
readme = "README.md"
authors = [
    { name = "Thomas Jurczyk", email = "pyristfeuer@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
conllu2vert = "conllu2vert:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
